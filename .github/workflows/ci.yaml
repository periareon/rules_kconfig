name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

env:
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

  ci-examples:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
        example:
          - simple
          - overrides
          - settings_labels
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

  # The WebAssembly backend, the way a release produces and uses it: the
  # module is built with Bazel and published (here as a workflow artifact,
  # by the release as an asset whose URL and integrity go into module.bzl),
  # and the example repositories are generated with it on a Bazel that has
  # `execute_wasm`, pointed at it by `RULES_KCONFIG_WASM`. No Python
  # interpreter takes part in the examples.
  ci-wasm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
    env:
      USE_BAZEL_VERSION: 9.x
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build the module
        run: |
          bazel ${BAZEL_STARTUP_FLAGS[@]} build //kconfig/private/wasm:kconfig_wasm
          cp "$(bazel ${BAZEL_STARTUP_FLAGS[@]} cquery --output=files //kconfig/private/wasm:kconfig_wasm)" "${RUNNER_TEMP}/kconfig.wasm"
          echo "RULES_KCONFIG_WASM=${RUNNER_TEMP}/kconfig.wasm" >> "${GITHUB_ENV}"
          echo "integrity: sha256-$(shasum --algorithm 256 "${RUNNER_TEMP}/kconfig.wasm" | awk '{ print $1 }' | xxd -r -p | base64)"

      - name: Publish the module
        uses: actions/upload-artifact@v4
        with:
          name: kconfig.wasm-${{ matrix.os }}
          path: ${{ env.RULES_KCONFIG_WASM }}
          if-no-files-found: error

      # The examples name an `interpreter` so that they also run where the
      # module cannot; it is dropped here so that a fall-back to the Python
      # backend would fail rather than pass unnoticed.
      - name: Generate the example repositories with the module
        run: |
          sed -i.bak '/interpreter = /d' examples/*/MODULE.bazel
          for example in simple overrides settings_labels; do
            echo "::group::${example}"
            (cd "examples/${example}" && bazel ${BAZEL_STARTUP_FLAGS[@]} test //... \
              --experimental_repository_ctx_execute_wasm \
              --repo_env=RULES_KCONFIG_WASM="${RULES_KCONFIG_WASM}")
            echo "::endgroup::"
          done

  ci-format:
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.2.0
      - uses: DoozyX/clang-format-lint-action@v0.14
        with:
          source: '.'
          extensions: 'h,c,cc'
          clangFormatVersion: 14
