name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

env:
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          # The short output root on the runner's data drive; windows-11-arm has
          # none, and C: serves.
          $root = if (Test-Path "D:\") { "D:/bzl" } else { "C:/bzl" }
          echo "startup --output_user_root=$root" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

  # The examples, each on the default Bazel with the native build of the
  # parser for the host (a source checkout carries none, so the one
  # `ci-tool-build` made is named with `RULES_KCONFIG_TOOL`). `upstream`
  # fetches the Linux, U-Boot and BusyBox trees and runs their scripts, so
  # not on Windows.
  ci-examples:
    runs-on: ${{ matrix.os }}
    needs:
      - ci-tool-build
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
        example:
          - simple
          - overrides
          - settings_labels
          - kconfig_version
          - upstream
        include:
          - os: macos-latest
            key: macos-aarch64
          - os: ubuntu-24.04
            key: linux-x86_64
          - os: ubuntu-24.04-arm
            key: linux-aarch64
          - os: windows-2022
            key: windows-x86_64
        exclude:
          - os: windows-2022
            example: upstream
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          # The short output root on the runner's data drive; windows-11-arm has
          # none, and C: serves.
          $root = if (Test-Path "D:\") { "D:/bzl" } else { "C:/bzl" }
          echo "startup --output_user_root=$root" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # The native build for this host.
      - uses: actions/download-artifact@v4
        with:
          name: kconfig_tool-${{ matrix.key }}
          path: ${{ runner.temp }}/kconfig_tool

      # Build and Test the code
      - name: Test (Unix)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: |
          chmod +x "${RUNNER_TEMP}"/kconfig_tool/kconfig_tool-*
          bazel ${BAZEL_STARTUP_FLAGS[@]} test //... \
            --repo_env=RULES_KCONFIG_TOOL="${RUNNER_TEMP}/kconfig_tool/kconfig_tool-${{ matrix.key }}"
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: |
          $tool = "$env:RUNNER_TEMP/kconfig_tool/kconfig_tool-${{ matrix.key }}.exe" -replace '\\', '/'
          & bazel $env:BAZEL_STARTUP_FLAGS test //... "--repo_env=RULES_KCONFIG_TOOL=$tool"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: startswith(runner.os, 'Windows')

  # The WebAssembly backend, the way a release produces and uses it: the
  # module is built with Bazel and published (here as a workflow artifact,
  # by the release as an asset whose URL and integrity go into module.bzl),
  # and the example repositories are generated with it on every host, on a
  # Bazel that has `execute_wasm`, pointed at it by `RULES_KCONFIG_WASM`.
  #
  # Building fetches toolchains (Rust with the wasm32-wasip1 target, and the
  # wasi-sdk for the kernel's C); running the module needs nothing, so the two
  # are separate jobs and the examples take the one module built on Linux.
  ci-wasm-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
    env:
      USE_BAZEL_VERSION: 9.x
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The module the way a release builds it (release_prep.sh), and the
      # wasi-sdk toolchain's own smoke test.
      - name: Build the module
        run: |
          bazel ${BAZEL_STARTUP_FLAGS[@]} run //kconfig/private/parser:kconfig_wasm_release -- "${RUNNER_TEMP}"
          bazel ${BAZEL_STARTUP_FLAGS[@]} build --config=wasm32 -c opt //tools/wasi_sdk/test:hello
          echo "integrity: sha256-$(shasum --algorithm 256 "${RUNNER_TEMP}/kconfig.wasm" | awk '{ print $1 }' | xxd -r -p | base64)"

      - name: Publish the module
        uses: actions/upload-artifact@v4
        with:
          name: kconfig.wasm-${{ matrix.os }}
          path: ${{ runner.temp }}/kconfig.wasm
          if-no-files-found: error

  # The native builds of the parser, one per platform, the way a release
  # produces them (release.yaml's `binaries` job): `kconfig_tool-<os>-<cpu>`,
  # for the Bazels that cannot run the module.
  ci-tool-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            key: macos-aarch64
          - os: ubuntu-24.04
            key: linux-x86_64
          - os: ubuntu-24.04-arm
            key: linux-aarch64
          - os: windows-2022
            key: windows-x86_64
          # - os: windows-11-arm
          #   key: windows-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          # The short output root on the runner's data drive; windows-11-arm has
          # none, and C: serves.
          $root = if (Test-Path "D:\") { "D:/bzl" } else { "C:/bzl" }
          echo "startup --output_user_root=$root" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')

      - name: Build the native parser (Unix)
        if: startswith(runner.os, 'Windows') != true
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} run //kconfig/private/parser:kconfig_tool_release -- "${RUNNER_TEMP}"
      - name: Build the native parser (Windows)
        if: startswith(runner.os, 'Windows')
        run: |
          & bazel $env:BAZEL_STARTUP_FLAGS run //kconfig/private/parser:kconfig_tool_release -- "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the native parser
        uses: actions/upload-artifact@v4
        with:
          name: kconfig_tool-${{ matrix.key }}
          path: ${{ runner.temp }}/kconfig_tool-${{ matrix.key }}*
          if-no-files-found: error

  ci-wasm:
    needs: [ci-wasm-build, ci-tool-build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            key: macos-aarch64
          - os: ubuntu-24.04
            key: linux-x86_64
          - os: ubuntu-24.04-arm
            key: linux-aarch64
          - os: windows-2022
            key: windows-x86_64
    env:
      USE_BAZEL_VERSION: 9.x
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          # The short output root on the runner's data drive; windows-11-arm has
          # none, and C: serves.
          $root = if (Test-Path "D:\") { "D:/bzl" } else { "C:/bzl" }
          echo "startup --output_user_root=$root" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # The module built on Linux; a module is the same whatever host built it.
      - uses: actions/download-artifact@v4
        with:
          name: kconfig.wasm-ubuntu-24.04
          path: ${{ runner.temp }}/kconfig_wasm
      # The native build for this host.
      - uses: actions/download-artifact@v4
        with:
          name: kconfig_tool-${{ matrix.key }}
          path: ${{ runner.temp }}/kconfig_tool

      # Windows runs Bazel from its native shell, like the other jobs, so that
      # the run is what a Windows user gets.
      - name: Generate the example repositories with the module (Unix)
        if: startswith(runner.os, 'Windows') != true
        run: |
          for example in simple overrides settings_labels kconfig_version; do
            echo "::group::${example}"
            (cd "examples/${example}" && bazel ${BAZEL_STARTUP_FLAGS[@]} test //... \
              --experimental_repository_ctx_execute_wasm \
              --repo_env=RULES_KCONFIG_WASM="${RUNNER_TEMP}/kconfig_wasm/kconfig.wasm")
            echo "::endgroup::"
          done
      # The Linux, U-Boot and BusyBox trees through the module: interpreted,
      # the kernel's tree takes the module a few minutes per repository, so
      # on Linux only.
      - name: Generate the upstream repositories with the module (Linux)
        if: startswith(runner.os, 'Linux')
        run: |
          (cd examples/upstream && bazel ${BAZEL_STARTUP_FLAGS[@]} test //... \
            --experimental_repository_ctx_execute_wasm \
            --repo_env=RULES_KCONFIG_WASM="${RUNNER_TEMP}/kconfig_wasm/kconfig.wasm")
      - name: Generate the example repositories with the module (Windows)
        if: startswith(runner.os, 'Windows')
        run: |
          $module = "$env:RUNNER_TEMP/kconfig_wasm/kconfig.wasm" -replace '\\', '/'
          foreach ($example in @("simple", "overrides", "settings_labels", "kconfig_version")) {
            Write-Output "::group::$example"
            Push-Location "examples/$example"
            try {
              & bazel $env:BAZEL_STARTUP_FLAGS test //... --experimental_repository_ctx_execute_wasm "--repo_env=RULES_KCONFIG_WASM=$module"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
              Write-Output "::endgroup::"
            }
          }

      # The same with the native build, which any Bazel can run: without
      # `execute_wasm` enabled the rules take it.
      - name: Generate the example repositories with the native build (Unix)
        if: startswith(runner.os, 'Windows') != true
        run: |
          chmod +x "${RUNNER_TEMP}"/kconfig_tool/kconfig_tool-*
          for example in simple overrides settings_labels kconfig_version upstream; do
            echo "::group::${example}"
            (cd "examples/${example}" && bazel ${BAZEL_STARTUP_FLAGS[@]} test //... \
              --repo_env=RULES_KCONFIG_TOOL="${RUNNER_TEMP}/kconfig_tool/kconfig_tool-${{ matrix.key }}")
            echo "::endgroup::"
          done
      - name: Generate the example repositories with the native build (Windows)
        if: startswith(runner.os, 'Windows')
        run: |
          $tool = "$env:RUNNER_TEMP/kconfig_tool/kconfig_tool-${{ matrix.key }}.exe" -replace '\\', '/'
          foreach ($example in @("simple", "overrides", "settings_labels", "kconfig_version")) {
            Write-Output "::group::$example"
            Push-Location "examples/$example"
            try {
              & bazel $env:BAZEL_STARTUP_FLAGS test //... "--repo_env=RULES_KCONFIG_TOOL=$tool"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
              Write-Output "::endgroup::"
            }
          }

  ci-format:
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.2.0
      - uses: DoozyX/clang-format-lint-action@v0.14
        with:
          source: '.'
          extensions: 'h,c,cc'
          clangFormatVersion: 14

  # Single job that every other job feeds into. It succeeds only when all of
  # them succeeded, so it is the one status check to mark as required in the
  # branch protection rules; new jobs only need to be added to `needs` here.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - ci
      - ci-examples
      - ci-wasm
      - ci-format
    steps:
      - name: Report job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "${RESULTS}"
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
