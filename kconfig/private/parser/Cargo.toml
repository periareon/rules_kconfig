[package]
name = "kconfig"
version = "0.0.0"
edition = "2024"
publish = false

# A manifest for crate_universe, which resolves the dependencies below into
# `Cargo.lock` and `cargo-bazel-lock.json`; Bazel builds the crate.
[lib]
path = "src/lib.rs"

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
